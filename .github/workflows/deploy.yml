name: Deploy SmartZap

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'PROGRESS.md'
      - 'RELATORIO.md'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/optivradigital/smartzap:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy no EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GHCR_TOKEN
          script: |
            set -e
            echo '=== Limpando imagens antigas ==='
            docker image prune -f || true

            echo '=== Entrando na pasta ==='
            cd /home/ubuntu/apps/smartzap

            echo '=== Puxando código novo do GitHub ==='
            git fetch optivra
            git checkout main 2>/dev/null || git checkout -b main optivra/main
            git reset --hard optivra/main

            echo '=== Login no GHCR ==='
            echo "$GHCR_TOKEN" | docker login ghcr.io -u optivradigital --password-stdin

            echo '=== Baixando nova imagem ==='
            docker pull ghcr.io/optivradigital/smartzap:latest

            echo '=== Reiniciando container ==='
            docker compose up -d --force-recreate

            echo '=== Aguardando subir ==='
            sleep 15

            echo '=== Health check ==='
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/health || echo '000')
            if [ "$STATUS" = '200' ] || [ "$STATUS" = '307' ] || [ "$STATUS" = '401' ]; then
              echo "✅ SmartZap OK (HTTP $STATUS)"
            else
              echo "❌ SmartZap não respondeu (HTTP $STATUS)"
              docker logs smartzap --tail 50
              exit 1
            fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
