name: Deploy SmartZap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy no EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "=== Entrando na pasta ==="
            cd /home/ubuntu/apps/smartzap

            echo "=== Puxando código novo do GitHub ==="
            git fetch optivra
            git checkout main 2>/dev/null || git checkout -b main optivra/main
            git reset --hard optivra/main

            echo "=== Build Docker ==="
            docker compose build --no-cache

            echo "=== Reiniciando container ==="
            docker compose up -d --force-recreate

            echo "=== Aguardando subir ==="
            sleep 15

            echo "=== Health check ==="
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/api/health || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "401" ]; then
              echo "✅ SmartZap OK (HTTP $STATUS)"
            else
              echo "❌ SmartZap não respondeu (HTTP $STATUS)"
              docker logs smartzap --tail 50
              exit 1
            fi
