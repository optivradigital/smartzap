name: Deploy Staging (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build Imagem Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/optivradigital/smartzap:staging
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.STAGING_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy Staging no EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GHCR_TOKEN
          script: |
            set -e
            echo '=== Login no GHCR ==='
            echo "$GHCR_TOKEN" | docker login ghcr.io -u optivradigital --password-stdin

            echo '=== Baixando imagem staging ==='
            docker pull ghcr.io/optivradigital/smartzap:staging

            echo '=== Reiniciando container staging ==='
            cd /home/ubuntu/apps/smartzap-staging
            docker compose up -d --force-recreate

            echo '=== Aguardando subir ==='
            sleep 15

            echo '=== Health check staging ==='
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3004/api/health || echo '000')
            if [ "$STATUS" = '200' ] || [ "$STATUS" = '307' ] || [ "$STATUS" = '401' ]; then
              echo "✅ Staging OK (HTTP $STATUS)"
            else
              echo "❌ Staging não respondeu (HTTP $STATUS)"
              docker logs smartzap-staging --tail 50
              exit 1
            fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
