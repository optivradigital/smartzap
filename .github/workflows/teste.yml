name: Deploy SmartZap (teste)

# Ambiente de testes: cada push em develop publica em https://smartzap-teste.optivra.digital
# (container smartzap-teste no Xango, porta 3012). Usa os MESMOS dados de produção
# (Supabase/Redis/Evolution) — serve pra validar código/UI antes do PR develop → main.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-teste
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image (develop)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/optivradigital/smartzap:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://smartzap-teste.optivra.digital
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy no Xango (teste)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /home/ubuntu/apps/smartzap-teste
            echo "$GHCR_TOKEN" | docker login ghcr.io -u optivradigital --password-stdin
            docker pull ghcr.io/optivradigital/smartzap:develop
            docker compose up -d --force-recreate
            sleep 15
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3012/api/health || echo '000')
            if [ "$STATUS" = '200' ] || [ "$STATUS" = '307' ] || [ "$STATUS" = '401' ]; then
              echo "✅ SmartZap teste OK (HTTP $STATUS)"
            else
              echo "❌ SmartZap teste não respondeu (HTTP $STATUS)"
              docker logs smartzap-teste --tail 50
              exit 1
            fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
